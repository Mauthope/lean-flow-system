<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#060a14" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Inner Flow Card Shape -->
  <g transform="translate(64, 64)">
    <!-- Ambient Glow behind symbol -->
    <rect x="72" y="72" width="240" height="240" rx="40" fill="url(#primaryGrad)" opacity="0.18" filter="url(#glow)" />

    <!-- Stylized Lean Flow 'L' Shape -->
    <path d="M 80, 80 L 140, 80 L 140, 240 L 220, 240 L 220, 296 L 80, 296 Z" fill="url(#primaryGrad)" />
    
    <!-- Stylized Lean Flow 'F' Shape -->
    <path d="M 176, 80 L 304, 80 L 304, 136 L 232, 136 L 232, 168 L 288, 168 L 288, 224 L 232, 224 L 232, 296 L 176, 296 Z" fill="url(#accentGrad)" />

    <!-- Dynamic Continuous Flow Chevron -->
    <path d="M 248, 192 L 312, 240 L 248, 288" fill="none" stroke="#22d3ee" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
